name: Build and release

# Disabled by default. Pushes and pull requests only build when the repository
# variable WINJITSU_CI is set to "true" (Settings → Secrets and variables →
# Actions → Variables). Change detection and the final status remain active. "Run workflow" always works: leave the version empty to just build,
# or give one (e.g. 0.4.0, matching pyproject.toml and arch/PKGBUILD) to also
# publish a GitHub release with the wheel and the source distribution, upload
# both to PyPI (Trusted Publishing, environment "pypi") and push arch/PKGBUILD
# to the winjitsu AUR package (needs the AUR_SSH_PRIVATE_KEY secret).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.4.0). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "src/**",
                  "tests/**",
                  "pyproject.toml",
                  "Makefile",
                  "install-nightly.sh",
                  ".github/workflows/release.yaml"
                ],
                "exclude": [
                  "**/*.md",
                  "**/LICENSE*"
                ]
              },
              "metadata": {
                "include": [
                  "README.md",
                  "LICENSE",
                  "arch/**"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  package:
    needs: [changes]
    if: (needs.changes.outputs.checks == 'true' || needs.changes.outputs.metadata == 'true') && (github.event_name == 'workflow_dispatch' || vars.WINJITSU_CI == 'true')
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The last one listed becomes the default python.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.14

      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
          ls -l dist

      # Install the wheel on the oldest and newest supported Python. There is
      # no X server here, so only check what works without one: the CLI, the
      # config handling and that every module imports.
      - name: Smoke test
        if: needs.changes.outputs.checks == 'true'
        run: |
          set -euo pipefail
          for py in 3.10 3.14; do
            echo "::group::Python $py"
            "python$py" -m venv "venv-$py"
            "venv-$py/bin/pip" install dist/*.whl
            "venv-$py/bin/winjitsu" --help > /dev/null
            XDG_CONFIG_HOME="$RUNNER_TEMP/config-$py" "venv-$py/bin/winjitsu" --see-config
            "venv-$py/bin/python" -c "import winjitsu.actions, winjitsu.cache, winjitsu.client, winjitsu.daemon, winjitsu.screen, winjitsu.window"
            echo "::endgroup::"
          done

      # tests/fakes.py stands in for xdotool and the window manager, so the
      # unit tests run here too, against the installed wheel.
      - name: Unit tests
        if: needs.changes.outputs.checks == 'true'
        run: |
          set -euo pipefail
          for py in 3.10 3.14; do
            echo "::group::Python $py"
            XDG_CONFIG_HOME="$RUNNER_TEMP/config-$py" "venv-$py/bin/python" -m unittest discover -s tests -v
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: WinJitsu-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: winjitsu-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and check tag
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 0.4.0, without the v."
            exit 1
          fi

          code_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$code_version" != "$VERSION" ]]; then
            echo "::error::pyproject.toml says $code_version. Bump it to $VERSION first."
            exit 1
          fi

          pkgbuild_version=$(sed -nE 's/^pkgver=(.*)/\1/p' arch/PKGBUILD)
          if [[ "$pkgbuild_version" != "$VERSION" ]]; then
            echo "::error::arch/PKGBUILD says $pkgbuild_version. Bump it to $VERSION first."
            exit 1
          fi

          # The README and the project page link the files of this release.
          wheel_link="releases/download/v$VERSION/winjitsu-$VERSION-py3-none-any.whl"
          for page in README.md site/index.html; do
            if ! grep -Fq "$wheel_link" "$page"; then
              echo "::error::$page doesn't link $wheel_link. Update its download links to $VERSION first."
              exit 1
            fi
          done

          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: WinJitsu-dist
          path: release-assets

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          packages=("winjitsu-$VERSION-py3-none-any.whl" "winjitsu-$VERSION.tar.gz")
          for file in "${packages[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Package $file is missing or empty."
              exit 1
            fi
          done
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "winjitsu-$VERSION-py3-none-any.whl" \
            "winjitsu-$VERSION.tar.gz" \
            SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "WinJitsu v$VERSION" \
            --generate-notes \
            --latest

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/WinJitsu/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WinJitsu-dist
          path: dist

      # No API token: PyPI trusts this workflow file and environment directly.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR key
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the AUR_SSH_PRIVATE_KEY secret to update the AUR package."
            exit 1
          fi

      - name: Set up SSH and git
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -dm700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          # Pinned AUR host keys, see https://aur.archlinux.org
          cat > "$ssh_dir/known_hosts" << 'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          # Inside a container HOME is /github/home but ssh reads ~/.ssh from
          # /etc/passwd (/root), so pass the key and host keys explicitly.
          echo "GIT_SSH_COMMAND=ssh -i $ssh_dir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git config --global user.name "Evilchuck666"
          git config --global user.email "carlos.martinez.medina1992@gmail.com"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: repo

      # arch/PKGBUILD is the source of truth: copy it over the AUR one with
      # pkgrel reset to 1 and regenerate .SRCINFO. makepkg refuses root.
      - name: Push PKGBUILD to the AUR
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/winjitsu.git aur
          useradd -m builder
          cp repo/arch/PKGBUILD aur/PKGBUILD
          cd aur
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already at $VERSION."
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin master

  result:
    name: CI result
    if: always()
    needs: [changes, package, release, pypi, aur]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
